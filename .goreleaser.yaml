version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tyr
    main: .
    binary: tyr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Without this the binary carries the moment the build ran, so two builds of
    # the same commit differ and nobody can check a release against its source.
    # Pinning it to the commit makes the build reproducible.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Windows gets a zip, since that is what Explorer opens without a tool.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# One SBOM per archive, so what is in a release can be answered without
# unpacking it. Needs syft on the runner; the release workflow installs it.
sboms:
  - artifacts: archive

# What --snapshot stamps a build with, which is what the nightly ships: the next
# patch version, marked as a nightly, plus the commit it came from.
snapshot:
  version_template: "{{ incpatch .Version }}-nightly.{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit, with the tag it was in the
# comment: a tag can be moved to other code, a commit cannot. The tools they
# install are pinned to exact versions for the same reason, and so a new lint
# rule shows up as a reviewed bump rather than a red build out of nowhere.

jobs:
  build:
    # Every platform tyr releases for, so a Windows-only break shows up here
    # rather than in a release archive.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Once, not per platform: the race detector is slow, and the races it
      # finds are in tyr's own goroutines, which are the same everywhere.
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      # go.mod and go.sum are what a release builds from; one that is not
      # tidy is fixed in a pull request, not at release time.
      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      # The linter only ever sees one platform's files. Without this pass the
      # _windows.go half of every platform pair goes unlinted.
      - name: golangci-lint (windows build tags)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.15.0

  # Catches a vulnerable dependency, and a Go release whose fix tyr has not
  # picked up yet — it reports only what the code actually reaches, so a hit
  # here is a call path that exists rather than a version-number mismatch.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

name: Release

on:
  push:
    tags:
      - "v*"

# A tag is released once. Without this, a re-run or a second trigger on the same
# tag races the first: whichever uploads second gets 422 already_exists from
# GitHub and fails the run after the assets are already up.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # The release notes are the CHANGELOG.md section for this version, so what
      # GitHub shows and what the repo says are the same text. Without a section
      # to read, GoReleaser falls back to its commit list.
      - id: notes
        name: Release notes from the changelog
        run: |
          version=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "$GITHUB_REF_NAME")
          version=${version#v}
          if ./scripts/changelog.sh section "$version" > "$RUNNER_TEMP/notes.md" && [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "Release notes for $version taken from CHANGELOG.md." >> "$GITHUB_STEP_SUMMARY"
            echo "args=release --clean --release-notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md has no [$version] section; using the commit list"
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
          fi

      # GoReleaser shells out to syft for the SBOMs in .goreleaser.yaml; without
      # it on PATH the release fails rather than quietly shipping none.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
